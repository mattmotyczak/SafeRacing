apply_pr1:
  date: 2026-10-02
  by: sdd-apply
  scope: "PR1 only — tasks 1.1 through 1.17. Contract compliance and provenance; no layer count, period, duration or composition change. PR2 (2.1-2.16) NOT started."
  outcome: "All 17 PR1 tasks implemented. 152 changed lines across 4 source files."
  changed_files:
    src/index.css: "73+/16- — --shadow-hard token; 11 dead tokens deleted; false 'Legacy tokens' comment deleted; 4 overlay/divider roles, 1 ground tint, 5 scanline stops, 3 lamp-shadow hues added; 3 hard-offset sites collapsed onto var(--shadow-hard); .car-aura now reads var(--car-color); blur removal note."
    src/App.tsx: "37+/23- — 3 stoplight glows to hard offsets with per-lamp hue; drop-shadow and shadow-lg deleted; 2 pixel-font negative-tracking classes deleted; 8 of 9 text-white sites tokenised; 5 non-text white/black utilities tokenised; Jugar shadow onto shadow-hard; 5 entrance animations gated on prefersReducedMotion."
    src/components/ArcadeBackground.tsx: "19+/12- — ground container w-[200%] to w-[3840px] and both tiles to w-[1920px] (pure class swap); redundant dash backgroundSize/backgroundRepeat deleted; 3 border-white/5 and 1 bg-slate-900/20 tokenised."
    src/components/CarSprite.tsx: "23+/13- — 8 rx values moved onto the 4-unit grid; --car-color moved from the svg to the wrapper so .car-aura can read it; motion-reduce:animate-none added to the aura."
  verification:
    - "V.1 npx tsc --noEmit exits 0. Also npm run build exits 0."
    - "V.2 hex/rgba in src/**/*.tsx = 0 (was 3). Offset literal in src/ = exactly 1, inside --shadow-hard. blur = 0. rounded-* other than rounded-none = 0. rx= = 8, ry= = 0. var(--car-color) readers = 1. raw white/black/slate opacity utilities = 0. .arcade-scroll definition blocks = 4, unchanged for PR1."
    - "V.3 ground: pan 1920px, period 40px, 1920 mod 40 = 0 (= 48 periods) at every viewport width; speed 192 px/s; coverage 3840 >= 1100; the parked A/B boundary rests at screen x = 1344, outside the 1100px panel. Superseded tile was w-1/2, where 1100 mod 40 = 20 (seam) and 720 mod 40 = 0 (clean) — the asymmetry the delta records."
    - "Build-output inspection: all 10 new utilities and all 14 new custom properties are emitted in dist/assets/index-*.css, and .car-aura resolves var(--car-color). This closes the gap greps cannot: an undefined token emits no CSS and would fail silently."
  deviations_from_launch_summary:
    - id: score-value-colour
      launch_summary_said: "text-white x9 replaced by the on-dark token"
      implemented: "8 of 9 replaced. App.tsx score value keeps text-white, with a code comment naming it the exception."
      authority: "tasks.md 1.10 and the delta's per-site mapping table both exclude the score value from this change; its backing surface is the new playing scene, where on-dark measures 1.76:1 and #ffffff 1.95:1, both failing. It becomes legible only once tasks.md 2.12 puts a .pixel-panel HUD chip behind it."
    - id: reduced-motion-gate-count
      launch_summary_said: "gate the 6 ungated entrance animations"
      implemented: "5 gated — stage wrapper, menu, mode-select, question panel, game over. The footer wrapper was NOT gated."
      authority: "The run instructions forbid editing src/App.tsx:488-502, which contains the footer motion.div. tasks.md 1.17 names that wrapper as the 6th."
    - id: stoplight-in-pr1
      delta_said: "'the stoplight lamp' is PR2 visual work"
      implemented: "The lamp contract lands in PR1 — lit lamp takes a hard offset in a darkened shade of its own hue, unlit lamps take none."
      authority: "tasks.md 1.5 is a PR1 task and the run instructions state it explicitly. Deleting the three rgba() glows alone would have left the lamps shadowless, which is permitted but leaves the hard-offset-only contract half-delivered."
  engineering_notes:
    - >-
      Prose comments that QUOTE an audited literal break the audit that greps for it. Four
      comments added during this pass each contained one of the very strings the contract
      counts: the offset literal, the blur patterns, the rx values, and a deleted utility
      name. All were rewritten to describe without quoting. Any future comment added near
      these greps must follow the same rule.
    - >-
      A CSS comment cannot contain the glob src/** — the */ inside it terminates the comment
      early and Tailwind then parses the remainder as content inside @theme, failing the
      build with "@theme blocks must only contain custom properties". tsc and every grep
      passed on the broken file; only npm run build caught it. Run the build, not just tsc,
      whenever @theme changes.
    - >-
      The emitted-CSS check for deleted utilities is not a valid audit: @theme extends rather
      than replaces Tailwind's default palette, so --color-white, --color-slate-900 and
      --tw-drop-shadow are present in dist regardless of usage. Absence must be asserted on
      the source, which is what config.yaml actually specifies.
  not_done:
    - "PR2 tasks 2.1-2.16 — all seven scene layers, the atomic sky period+tile migration, answer feedback, question typography, score HUD chip, car tier recolour, and the 2.14 human sign-off gate."
    - "R3-2 automated seam regression test — not closable from this project."

apply_pr2_scene:
  date: 2026-10-02
  by: sdd-apply
  trigger: >-
    Maintainer reported red, yellow and orange pixels glowing behind the car, asked for
    them removed, and asked for the background scenery and road work to follow
    automatically. The crash signal was explicitly reduced to the existing fade.
  scope: "Tasks 2.1-2.8 (the scene and the road) plus the car-glow removal. Tasks 2.9-2.13 deliberately NOT started — see not_done."
  user_directives:
    - "Delete the red/orange/yellow pixels behind the car. Keep only the crash fade."
    - "Do not carry the per-pixel damage marks. The maintainer reported they rendered regardless of vehicle state."
    - "Stay inside this instruction and the already-proposed designs. Do not revisit other aspects."
  car_glow_root_cause: >-
    Three separate sources, not one. (1) .car-aura painted the car body colour across
    the whole sprite box at 0.6 opacity behind the car whenever lives >= 5. (2) The
    damage marks on the crash frame used --color-car-damage #ef4444 red and
    --color-car-spark #f97316 orange at 0.7 opacity. (3) --color-car-tier5 #facc15
    yellow is the 5+ lives body colour. The maintainer observed all three at once
    because the aura and the spark marks share the space directly behind the sprite.
  changed:
    src/index.css: >-
      11 --color-scene-* tokens added; --color-track-line, --color-dash and
      --color-ground-tint retired; .car-aura, @keyframes pulse and the .car-aura
      reduced-motion entry deleted; --color-car-damage and --color-car-spark deleted;
      scroll layers 3 -> 7 (sky 120s, hills 60s, trees 25s, ground 10s, edges 2s,
      rumble 2s, dashes 2s); reduced-motion entries 3 -> 7.
    src/components/ArcadeBackground.tsx: >-
      3 layers -> 7, repainted sky -> hills -> trees -> ground -> edges -> rumble ->
      dashes. Every animated layer now uses w-[3840px] containers with two
      w-[1920px] tiles, plus a second synced row so viewports wider than 1920px stay
      covered to 7680px. Sky migrated atomically to fixed tiles, a vertical two-stop
      sky-top-to-horizon gradient, a sun and two off-seam clouds. Hills are 3 SVG peaks
      at 213/853/1493; trees are 8 SVG trees at 120+240k. Ground is a flat road fill;
      edges are a 60px-period rumble-white gradient; rumble is a 192px-period
      red/white kerb; dashes repointed to --color-scene-road-dashes. Dead tileGradient
      and groundGradient constants removed.
    src/components/CarSprite.tsx: >-
      rx values returned to 2/1 per the 1.14 supersession; the damage prop and all four
      damage/spark rects deleted; the .car-aura sibling div deleted; the --car-color
      wrapper custom property deleted with it; header and crash-frame comments rewritten.
  verification:
    - "V.1 npx tsc --noEmit exits 0. npx vite build prints a built line."
    - "V.2 census 15 lines = 8 definitions + 7 reduced-motion entries. rx = 8, ry = 0, all rx in {1,2}. hex/rgba in ArcadeBackground.tsx = 0. --color-track-line, --color-dash and --color-ground-tint = 0 hits. car-aura / car-damage / car-spark / car-color / keyframes pulse = 0 hits outside prose comments."
    - "V.3 1920 mod {128, 640, 240, 40, 60, 192} = 0 for all six. Speeds 16 < 32 < 76.8 < 192 < 960."
  deviations:
    - id: sky-background-size-dropped
      task_said: "sky backgroundSize 100px -> 128px in the same atomic edit"
      implemented: "backgroundSize dropped entirely; the sky period is the 1920px tile width itself."
      authority: >-
        Once the checkerboard tile became a vertical two-stop gradient, a 128px
        backgroundSize banded that gradient visibly every 128px. Making the period the
        tile width is strictly stronger than 128 (1920 is an exact multiple of itself),
        so the seam invariant holds with a larger margin. Atomicity was preserved: the
        component was written in a single edit.
    - id: road-stripe-texture-retired
      task_said: "repoint the ground tint to --color-scene-road"
      implemented: "The 40px 1px stripe texture is gone; the road is a uniform --color-scene-road fill."
      authority: >-
        The stripe measured 1.02:1 against its own background, which is why 2.6 exists.
        With edge, rumble and dash layers now carrying all road structure, a uniform fill
        satisfies translateX(-50%) wrapping at every viewport by construction. The
        retired 40px period is recorded here so V.3's 1920 mod 40 = 0 is not read as a
        claim about a texture that no longer exists.
    - id: edge-lines-dashed-not-solid
      task_said: "road edge lines, repeating-linear-gradient, off-seam by construction"
      implemented: "40px runs separated by 20px gaps at the 60px period."
      authority: >-
        A fully solid band at 60px has nothing to animate at 960 px/s, which is the
        dead-animation failure this change exists to remove. 1920 mod 60 = 0 either way.
    - id: clearance-read-horizontal
      task_said: >-
        "23 px clearance" for hills and "72 px" for trees.
      implemented: "Read as horizontal distance from the tile boundary, not vertical."
      authority: >-
        213 - 380/2 = 23 and 120 - 96/2 = 72 match V.3's phrasing 'off-seam read of hills
        (23 px) and trees (72 px)' exactly. A literal 23px vertical sky slot between
        hills and treeline would read as a rendering bug.
    - id: spec-arithmetic-corrected
      task_said: "1920 mod {128, 640, 240, 40, 60, 192} = {15, 3, 8, 48, 32, 10}"
      implemented: "Corrected in tasks.md V.3 to 0, with the quotients shown as quotients."
      authority: >-
        The numbers were quotients, not remainders: 1920 = 15x128 = 3x640 = 8x240 =
        48x40 = 32x60 = 10x192. Every period divides 1920 exactly, so the design was
        right and only the labels were wrong. Left uncorrected, a verifier checking the
        invariant against V.3 would fail a correct implementation.
  engineering_notes:
    - >-
      PowerShell 5.1 corrupted src/index.css into UTF-16 twice in this session: once via
      Set-Content -Encoding UTF8 and once via shell redirection of git show. Both
      presented as 'Invalid declaration: @import "tailwindcss"' with the error text
      rendered as spaced-out UTF-16 bytes, which is the tell. Recovery is
      git restore --worktree -- src/index.css, never a shell write.
    - >-
      The CRASH PIXELS NEVER GATED ON STATE. BodyPixel accepted damage as a prop and
      only the isCrashed branch passed it, but the aura div rendered on lives >= 5
      regardless of crash state and was a full-box 0.6-opacity fill in the body colour.
      Read the branch conditions before assuming a visual is crash-only.
  not_done:
