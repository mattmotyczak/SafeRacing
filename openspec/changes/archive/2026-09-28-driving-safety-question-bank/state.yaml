source_of_truth:
  manual:
    title: "Manual del conductor de vehículos clade 4 ruedas (4R)"
    publisher: "Gobierno de la Ciudad de Buenos Aires"
    edition: 2023
    local_filename: "MANUAL_Vehiculo_4Ruedas_2023 SA.pdf"
    size_mb: 68.3
    how_to_obtain: >-
      Free public GCBA publication. Download fresh on whichever machine needs it and drop it in
      references/, which is gitignored. NOT committed to this repo — see not_committed.manual.
    extraction_verified_on: 2026-09-28
  manual_extraction: >-
    200 pages, ~265,275 characters, text layer only. pypdf 6.19.0. NOT a scan despite the 68 MB size.
    PDF page index is offset by 1 from the printed page: pages[i] is printed page i+1, so citations read
    (p<n>) using the printed number.
  manual_pitfalls: >-
    (1) The text layer carries NO accents — cinturon extracts as cintur?n — so every search must be
    diacritic-insensitive, or a literal search silently returns zero and the fact looks absent.
    (2) The speed-limit TABLE is a graphic and is NOT in the text layer: searches for '60 km/h',
    '100 km/h' and 'Limites de velocidad' all return zero pages. Speed figures are therefore cited to
    Ley 24.449 art. 51, not to the manual. A missing number does not mean the manual lacks it.
  corrects_a_source: >-
    The manual states the safe following distance is TWO seconds (p71). The commercial study site
    Trivorio says one second. The manual is authoritative and one second is wrong.
  exam_format: >-
    Deliberately absent from the bank. Trivorio says 40 questions / 34 to pass; cursodemanejo says 30 / 23;
    the official GCBA page is silent. Unresolved, so no question asserts it.
