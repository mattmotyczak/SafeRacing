art_direction_amendment:
  date: 2026-10-03
  by: sdd-spec
  phase_at_amendment: apply
  note: >-
    Mid-change re-plan. The scene art delivered by apply_pr2_scene was reviewed and REJECTED as
    "simple blocks of color without any detail". The art direction is REPLACED. This is a
    Phase 0 replanning event, NOT a phase transition: next_phase stays apply, and the phases
    table above is untouched.
  trigger: >-
    The maintainer reviewed the delivered scene and named three references. Enter the Gungeon
    and middle-generation (Gen-3) Pokemon are both true pixel art and share one technique set.
    Celeste is the outlier — hand-drawn vector bezier art on no pixel grid — and was RULED OUT
    as unreachable. The maintainer then chose the Gungeon / Gen-3 pixel-art direction and fixed
    the sprite resolutions in one pass.
  ruling: >-
    Every scene sprite form carries a hard 1px dark outline and a four-tone ramp (base, shadow,
    light, highlight); every ramp and band transition is Bayer 4x4 ordered dithered; distant
    layers blend toward the sky token and desaturate, and ATMOSPHERIC DESATURATION IS THE
    PRIMARY DEPTH CUE — complementary to the parallax speed ladder, not a replacement for it.
    Every sprite renders with shape-rendering="crispEdges" and image-rendering: pixelated, at
    its own aspect-matched viewBox.
  superseded:
    - >-
      Flat single-colour sprite fills — the entire premise of the delivered scene art. No flat
      fill is a conforming value for any scene material.
    - >-
      The fixed count of 11 --color-scene-* tokens — replaced by per-material tone ramps,
      roughly 20 entries including outlines. NOT a rule bend: AGENTS.md hard rule 1 requires a
      token per colour and a four-tone ramp cannot be expressed without one token per tone, so
      the ramp widens the NUMBER the rule already demands and changes no part of the rule.
    - >-
      Band stacks as a constraint on shape. preserveAspectRatio="none" (ArcadeBackground.tsx:143
      hills, :202 trees) was the documented reason diagonals were avoided: the fixed 1920px tile
      keeps horizontal scale at exactly 1:1, while the viewBox is stretched on the vertical axis,
      which softens every diagonal. Pixel art needs diagonals, so the stretch goes and
      per-sprite aspect-matched viewBoxes replace it. meet is NOT a safe substitute — it shrinks
      the horizontal scale too and silently breaks the 1920px tiling.
  unchanged:
    - >-
      NO-RASTER. Art stays hand-authored inline SVG — no image files, no sprite sheet, no new
      runtime dependency. Pixel art is a technique, not a file format; nothing about the ramp
      needs a raster asset.
    - >-
      All PR2 geometry. Every period, duration, speed, tile width, clearance and paint-order
      decision stands. The amendment reworks art OUTPUT only, so the parallax arithmetic in V.3
      is untouched.
    - "next_phase: apply, and the phases table."
    - "2.16 and P.14 are separate sign-offs. This amendment discharges neither."
  resolutions_fixed:
    car: 32x16
    tree: 32x48
    cloud: 48x24
    sun: "32x32 — stepped octagon with 4 blocky rays; today a <circle>"
    hills: "3-tone mass with dithered band transitions"
    grass: "3-tone band with tufts breaking the top edge"
  verified_against_source:
    - >-
      image-rendering: pixelated exists ONLY as an inline style on the car <svg>
      (CarSprite.tsx:87). No CSS rule in src/ sets it and no scene sprite carries it.
      shape-rendering appears NOWHERE in src/. Both are work to be done, not existing
      behaviour — a verifier must not read them as already delivered.
    - >-
      src/index.css carries 12 --color-scene-* tokens, not the 11 the delta enumerated.
      --color-scene-grass #46964f paints the verge and was in no spec list at all; the delta's
      ramp table now names it.
    - >-
      The stale "the namespace does not exist today" claim on tasks.md 2.1 is corrected there.
  artifacts_updated:
    - "openspec/design/arcade-retrofit.md — new 'Amendment 2026-10-03' section; the Car sprite approach row is marked amended in its fill discipline only, with NO-RASTER explicitly unchanged."
    - "openspec/changes/arcade-scene-backdrop/specs/game/spec.md — the palette requirement rewritten to ramp groups with the deviation recorded in place; four requirements added; the header note records the rejected references and the token-count discrepancy."
    - "openspec/changes/arcade-scene-backdrop/tasks.md — new PR2-A group, tasks P.1 through P.14, all UNCHECKED; 2.1, V.2 and V.5 annotated."
    - "openspec/changes/arcade-scene-backdrop/state.yaml — this block, plus the spec_revision counts."
  known_contradictions_not_edited:
    - >-
      design.md Decision 4 still fixes the palette at 11 tokens, and its Technical Approach
      still describes every layer as a gradient or clip-path silhouette while the source draws
      inline SVG. Both are design-phase artifacts and were left alone deliberately.
    - >-
      proposal.md, the delta's own Status header, the PR2 task text and openspec/status.md all
      describe the scene as unimplemented or proposed-only, while apply_pr2_scene records that
      it IS implemented. Left for the apply and verify phases.

