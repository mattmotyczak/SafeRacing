bugs_found_during_apply:
  - id: lap-seam-immediate-repeat
    found: 2026-09-28
    where: src/App.tsx getNewQuestion
    defect: >-
      Draw-without-replacement reset its served-array at pool exhaustion, so the first question of a new
      lap could be the last question of the previous lap. Measured 2 immediate repeats in 4,000 easy
      draws. Review did not catch it; simulation did.
    fix: >-
      A second ref, lastId, is excluded from the fresh pool on the exhausted branch, guarded by
      db.length > 1 so a one-question bank cannot build an empty pool. After the fix, 0 repeats in
      30,000 draws per bank.
    species: a reset that discards the one piece of state needed to prevent the bad case
design_refinements:
  - id: no-repeat-is-stronger-than-specced
    rule: >-
      tasks.md 13 and the game delta spec describe excluding only the PREVIOUSLY DRAWN question. What
      shipped is full draw-without-replacement until exhaustion plus the lastId seam guard. The weaker
      rule is the one that produces the lap-seam repeat. Obligation DISCHARGED 2026-09-28: design.md
      section 9 and the game delta spec now both carry the stronger form, including the lastId seam
      guard, the db.length > 1 guard, the soft fallback and the db.indexOf keying.
  - id: answer-remap-is-runtime-not-type
    rule: >-
      The remap is the load-bearing half of the shuffle: answer is recomputed as
      options.indexOf(picked.options[picked.answer]), capturing the correct option's TEXT before the
      swap. Shuffling without remapping marks every correct answer wrong and tsc cannot see it.
  - id: pool-index-vs-db-index
    rule: >-
      Exclusion must key on db.indexOf(picked), not a pool-relative index. The pool comes from .filter(),
      so pool-relative indices shift as it shrinks and the exclusion would silently stop working.
tracked_gaps:
  note: >-
    Recorded rather than erased. Not listed in closes_gaps because a gap belongs there only when this
    change actually closes it.
  items:
    - id: audit-allowlist-excludes-change-folders
      file: openspec/config.yaml
      found: 2026-09-28
      defect: >-
        rules.verify.audits is file-level and does not include openspec/changes/**, so a change folder
        cannot quote the strings it exists to correct. verify-report.md refers to gap 8 and to the
        offending literals by description rather than by value.
      status: undecided
      options: >-
        Add openspec/changes/** to the allowlist with a correction-note reading rule, or accept that
        gap-closing changes must refer to gaps by number only.
    - id: gap-8-footer
      file: src/App.tsx footer panel
      status: open-by-design
      detail: Copy and authorship decision, not a data one. Explicit non-goal of this change.
method_notes:
  - >-
    Two verification rounds failed on my own regexes, not on the artifact: a `$` anchor placed before a
    trailing comma reported 2 rows instead of 110, and an over-greedy pattern matched (ord, 'answer')
    pairs out of the answer block and contaminated every set. max_q=2 was the tell. When a structural
    verifier reports an absurd count, suspect the verifier and print raw lines before touching the file.
  - >-
    A one-question bank must repeat, so "zero repeats" is a valid invariant only when db.length > 1.
    Assert it conditionally rather than reading that failure as a code defect.
  - >-
    max(CASE WHEN iscorrect THEN 1 ELSE 0 END) returns 1, not a position; it cannot locate the correct
    answer. Read the aggregated array directly, or use array_position(array_agg(...), <correct text>).
  - >-
    Neon console table views page at 50 rows. A "max of 50 per table" report with one smaller table
    showing everything is a page boundary, not a truncated insert.
  - >-
    The explicit BEGIN/COMMIT in 0002 means a failed run can only leave 0 rows or all 550. That argument
    needs no database access and refutes a partial-insert report on its own.
next_phase: archive
not_committed:
  note: >-
    The change's own files are committed as a59386c, with the fence in design.md section 7 confirmed
    against it. The one thing still deliberately uncommitted is recorded under manual below.
  manual:
    thing: references/MANUAL_Vehiculo_4Ruedas_2023 SA.pdf
    status: deliberately never committed
    reason: >-
      68.3 MB, a copyrighted GCBA publication, in a PUBLIC repository with no Git LFS. Committing it
      would grow .git from 0.8 MB to ~69 MB permanently — a pushed blob is unreclaimable by git rm, and
      the only real removal is a history rewrite that changes every commit hash on new_designs and
      forces a full re-clone. The document is a free public download, so the blob buys a download that
      costs nothing and stores a copyrighted work permanently and publicly.
    do_not: >-
      Do not "fix" this by adding the PDF, and do not raise .gitignore to un-ignore it. The tracked
      references/README.md documents the retrieval instead. If a future change genuinely needs the file
      in-repo, set up Git LFS first and get an explicit decision from the maintainer.
