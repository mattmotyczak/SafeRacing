    summary: >-
      db/migrations/0001_bootstrap.sql seeds easy_questions / easy_answers but never
      creates them, so migrations cannot bootstrap a fresh database.
  - id: GAP-2
    severity: medium
    summary: >-
      No verify phase ever ran. No live-server curl, no double-apply idempotency test,
      no fresh-database test. Claims in ORCHESTRATOR.md Phase 8 are unchecked.
  - id: GAP-3
    severity: medium
    summary: >-
      neondb_guide.txt still documents the wrong schema (single `questions` table,
      quoted CamelCase identifiers, a nonexistent `idAnswer` column) and now
      contradicts the migration and server.js.
  - id: GAP-4
    severity: low
    summary: >-
      Answer index is derived from answer primary-key order at query time rather than
      stored, so option order is not guaranteed stable if rows are renumbered.
